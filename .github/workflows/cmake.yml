name: CMake

# Pushes to main run CI unless they only change docs. Any other branch, such as
# a pull request's, runs it only when started by hand (Actions > CMake > Run
# workflow), so a PR is checked when it is ready rather than on every push.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# The Vulkan SDK every job but the web ones builds with (see
# .github/actions/vulkan-sdk), which the devcontainer
# (.devcontainer/devcontainer.json) also installs, and the Emscripten SDK the
# web jobs build with (see .github/actions/emsdk).
env:
  VULKAN_SDK_VERSION: 1.4.363.1
  EMSDK_VERSION: 7.0.1

# A newer run for the same branch cancels one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs at once: build-windows-release, build-windows-debug,
# build-block-world (Windows, Release), build-render-check-windows and
# build-render-check-linux (Release), build-linux-debug, build-linux-release,
# build-web, and build-web-threads.
jobs:
  build-windows:
    name: build-windows-${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      # One configuration failing doesn't cancel the others.
      fail-fast: false
      matrix:
        include:
          - config: release
            build-type: Release
          - config: debug
            build-type: Debug

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: "recursive"

    - name: Install the Vulkan SDK
      uses: ./.github/actions/vulkan-sdk

    # Debug binaries link the debug CRT, which isn't on PATH even in a
    # developer shell, so it is added from the toolset's redist directory.
    - name: Build and test Game Bits
      shell: cmd
      working-directory: ${{github.workspace}}
      env:
        GB_BUILD_TYPE: ${{ matrix.build-type }}
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        if "%GB_BUILD_TYPE%"=="Debug" set "PATH=%VCToolsRedistDir%debug_nonredist\x64\Microsoft.VC143.DebugCRT;%PATH%"
        cmake -G Ninja -DCMAKE_BUILD_TYPE=%GB_BUILD_TYPE% -S . -B out/build/ci || exit /b 1
        cmake --build out/build/ci || exit /b 1
        ctest --test-dir out/build/ci --output-on-failure || exit /b 1

  # Block World builds its own copy of the Game Bits libraries it uses, so it
  # runs as its own job, alongside the ones above rather than after them. It
  # builds only on Windows in Release.
  build-block-world:
    name: build-block-world
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: "recursive"

    - name: Install the Vulkan SDK
      uses: ./.github/actions/vulkan-sdk

    - name: Build Block World example
      shell: cmd
      working-directory: ${{github.workspace}}
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -S examples/block-world -B examples/block-world/out/build/ci || exit /b 1
        cmake --build examples/block-world/out/build/ci --target block_world || exit /b 1

  # RenderCheck also builds its own copy of the Game Bits libraries it uses, so
  # it runs as its own job on each platform, in Release. On Linux, it also runs
  # RenderCheck's scripts on lavapipe, and uploads the frames they save.
  build-render-check:
    name: build-render-check-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: "recursive"

    - name: Install packages
      if: runner.os == 'Linux'
      run: sudo tools/install-linux-packages.sh

    - name: Install the Vulkan SDK
      uses: ./.github/actions/vulkan-sdk

    - name: Build RenderCheck on Windows
      if: runner.os == 'Windows'
      shell: cmd
      working-directory: ${{github.workspace}}
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -S examples/render-check -B examples/render-check/out/build/ci || exit /b 1
        cmake --build examples/render-check/out/build/ci --target render_check || exit /b 1

    - name: Build RenderCheck on Linux
      if: runner.os == 'Linux'
      working-directory: ${{github.workspace}}
      run: |
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -S examples/render-check -B examples/render-check/out/build/ci
        cmake --build examples/render-check/out/build/ci --target render_check

    # Every script runs, even after one fails, so all their frames are uploaded.
    - name: Run RenderCheck's scripts
      if: runner.os == 'Linux'
      working-directory: ${{github.workspace}}
      run: |
        failed=0
        for script in examples/render-check/scripts/*.txt; do
          echo "::group::$script"
          tools/run-program.sh --exe bin/render_check --script "$script" --out-dir "out/run/render_check/$(basename "$script" .txt)" || failed=1
          echo "::endgroup::"
        done
        exit $failed

    # A program that hangs has its threads' stacks saved, which needs gdb to
    # attach to it under Ubuntu's ptrace restrictions.
    - name: Check that a hang saves stacks
      if: runner.os == 'Linux'
      working-directory: ${{github.workspace}}
      run: |
        if tools/run-program.sh --exe bin/render_check --steps "hide window; wait 100000" --timeout-secs 5 --out-dir out/run/hang; then
          echo "The run should have timed out."
          exit 1
        fi
        grep " main (" out/run/hang/hang-stacks.txt

    - name: Upload RenderCheck's frames
      if: runner.os == 'Linux' && always()
      uses: actions/upload-artifact@v7
      with:
        name: render-check-frames
        path: out/run/
        if-no-files-found: ignore

  # Linux builds every library with clang. Debug runs render asserts and death
  # tests, and Release compiles asserts out, as the Windows release job does.
  # The tests run in a virtual X server, so SDL's window tests use its X11
  # driver, as programs do. GitHub's runner is an ordinary user, so tests of
  # read-only files mean something, which they don't as root.
  build-linux:
    name: build-linux-${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: debug
            build-type: Debug
          - config: release
            build-type: Release

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: "recursive"

    - name: Install packages
      run: sudo tools/install-linux-packages.sh

    - name: Install the Vulkan SDK
      uses: ./.github/actions/vulkan-sdk

    - name: Build and test Game Bits
      working-directory: ${{github.workspace}}
      env:
        GB_BUILD_TYPE: ${{ matrix.build-type }}
      run: |
        cmake -G Ninja -DCMAKE_BUILD_TYPE=$GB_BUILD_TYPE -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -S . -B out/build/ci
        cmake --build out/build/ci
        xvfb-run -a ctest --test-dir out/build/ci --output-on-failure

  # The web builds, without threads and with them, build every library with
  # Emscripten in Debug, and run the tests under Node. They need no Vulkan SDK,
  # and nothing from tools/install-linux-packages.sh: the runner already has
  # CMake and Ninja, and SDL is built for the web, without the system's
  # windowing headers.
  build-web:
    name: build-${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: web
            threads: "OFF"
          - config: web-threads
            threads: "ON"

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: "recursive"

    - name: Install the Emscripten SDK
      uses: ./.github/actions/emsdk

    - name: Build and test Game Bits
      working-directory: ${{github.workspace}}
      env:
        GB_WEB_THREADS: ${{ matrix.threads }}
      run: |
        emcmake cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGB_WEB_THREADS=$GB_WEB_THREADS -S . -B out/build/ci
        cmake --build out/build/ci
        ctest --test-dir out/build/ci --output-on-failure
