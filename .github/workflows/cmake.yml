name: CMake

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  GB_BUILD_TYPE: Release
  VK_SDK_PATH: C:\VulkanSDK\1.2.162.0
  VULKAN_SDK: C:\VulkanSDK\1.2.162.0

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Setup Vulkan
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.204.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true

    - name: Build and test Game Bits
      shell: cmd
      working-directory: ${{github.workspace}}
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        cmake -G Ninja -DCMAKE_BUILD_TYPE=%GB_BUILD_TYPE% -S . -B out/build/ci || exit /b 1
        cmake --build out/build/ci || exit /b 1
        ctest --test-dir out/build/ci --output-on-failure || exit /b 1

    - name: Build Block World example
      shell: cmd
      working-directory: ${{github.workspace}}
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        cmake -G Ninja -DCMAKE_BUILD_TYPE=%GB_BUILD_TYPE% -S examples/block-world -B examples/block-world/out/build/ci || exit /b 1
        cmake --build examples/block-world/out/build/ci --target block_world || exit /b 1
