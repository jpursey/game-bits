name: CMake

# Pushes to main run CI unless they only change docs. Any other branch, such as
# a pull request's, runs it only when started by hand (Actions > CMake > Run
# workflow), so a PR is checked when it is ready rather than on every push.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# A newer run for the same branch cancels one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  GB_BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Setup Vulkan
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.283.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true

    - name: Build and test Game Bits
      shell: cmd
      working-directory: ${{github.workspace}}
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        cmake -G Ninja -DCMAKE_BUILD_TYPE=%GB_BUILD_TYPE% -S . -B out/build/ci || exit /b 1
        cmake --build out/build/ci || exit /b 1
        ctest --test-dir out/build/ci --output-on-failure || exit /b 1

    - name: Build Block World example
      shell: cmd
      working-directory: ${{github.workspace}}
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        cmake -G Ninja -DCMAKE_BUILD_TYPE=%GB_BUILD_TYPE% -S examples/block-world -B examples/block-world/out/build/ci || exit /b 1
        cmake --build examples/block-world/out/build/ci --target block_world || exit /b 1

  # Linux builds every library but the SDL and Vulkan ones, with clang, in Debug
  # so render asserts and death tests run. GitHub's runner is an ordinary user,
  # so tests of read-only files mean something, which they don't as root. It is
  # pinned to 24.04 (clang 18), as clang 21's new warnings fail the build in
  # third-party headers.
  build-linux:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Install Ninja
      run: sudo apt-get install -y ninja-build

    - name: Build and test Game Bits
      working-directory: ${{github.workspace}}
      run: |
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -S . -B out/build/ci
        cmake --build out/build/ci
        ctest --test-dir out/build/ci --output-on-failure
