# Installs the Ubuntu packages CLAUDE.md lists for building and running Game
# Bits on Linux: Ninja, SDL's windowing headers, Mesa's Vulkan drivers
# (lavapipe), and Xvfb. The runner already has clang and CMake.
name: Linux packages
description: Installs the packages Game Bits builds and runs with on Linux.

runs:
  using: composite
  steps:
  - name: Install packages
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libdbus-1-dev libudev-dev mesa-vulkan-drivers xvfb
